branch:
  - reg: ^main$
    buttons:
      - name: 构建 Android 安装包
        description: 构建双架构完整包和轻量包；配置正式签名后发布到国内下载页。
        event: web_trigger_android
        inputs:
          AZURPILOT_REF:
            name: AzurPilot dev 提交
            description: 留空使用当前 dev；指定时填写完整的 40 位提交 SHA。
            type: input
            required: false
          FORCE:
            name: 强制重建
            type: switch
            default: "false"
