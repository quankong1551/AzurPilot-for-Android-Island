# Cloudflare 在公网入口验证 mTLS；源站用同一证书公钥验证正文签名。
# Cloudflare verifies public mTLS; the origin verifies body signatures with the same certificate.
limit_req_zone $binary_remote_addr zone=device_report:1m rate=2r/s;

server {
    listen 80;
    server_name api-apa-v1.nanoda.work;
    client_max_body_size 8k;
    client_body_timeout 10s;
    access_log off;

    location = /v1/device-reports {
        limit_req zone=device_report burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18882;
        proxy_connect_timeout 2s;
        proxy_read_timeout 40s;
        proxy_send_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
    location = /healthz { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
    location / { return 404; }
}

# 直连 TLS 必须出示指定客户端证书；optional_no_ca 允许钉住非自签的叶证书。
# Direct TLS requires the exact pinned client leaf; its issuing CA is managed by Cloudflare.
server {
    listen 443 ssl;
    server_name api-apa-v1.nanoda.work;
    ssl_certificate /etc/azurpilot-device-report/origin-cert.pem;
    ssl_certificate_key /etc/azurpilot-device-report/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:device_report_tls:1m;
    ssl_verify_client optional_no_ca;
    ssl_client_certificate /etc/azurpilot-device-report/client-cert.pem;
    client_max_body_size 8k;
    client_body_timeout 10s;
    access_log off;

    location = /v1/device-reports {
        if ($ssl_client_fingerprint != CLIENT_CERT_SHA1) { return 403; }
        limit_req zone=device_report burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18882;
        proxy_connect_timeout 2s;
        proxy_read_timeout 40s;
        proxy_send_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
    location = /healthz { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
    location / { return 404; }
}
